<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#0b0d10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>FSD Sightings Logger</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  </head>
  <body>
    <nav class="tab-bar" role="tablist">
      <button class="tab-btn active" data-tab="log" type="button">Log</button>
      <button class="tab-btn" data-tab="stats" type="button">Stats</button>
    </nav>

    <section id="page-log" class="page active" role="tabpanel">
      <div class="date-block">
        <div class="date-label">Today · America/New_York</div>
        <div class="date-value" id="date-value">—</div>
        <div class="totals-pill" id="totals-pill">
          Seen <strong id="tot-seen">0</strong>
          · FSD <strong id="tot-fsd">0</strong>
        </div>
      </div>

      <div class="stage">
        <div id="step-main">
          <button class="btn-primary" id="btn-saw" type="button">Saw a Tesla</button>
        </div>

        <div id="step-choice" class="hidden">
          <p class="prompt">Was FSD active?</p>
          <div class="choice-row">
            <button class="btn-choice btn-fsd-yes" id="btn-fsd-yes" type="button">
              FSD active
            </button>
            <button class="btn-choice btn-fsd-no" id="btn-fsd-no" type="button">
              FSD not active
            </button>
          </div>
        </div>
      </div>

      <div class="footer-actions">
        <button class="btn-undo" id="btn-undo" type="button" disabled>Undo last</button>
      </div>
    </section>

    <section id="page-stats" class="page" role="tabpanel">
      <div class="stats-header">
        <div class="stats-summary" id="stats-summary">Loading…</div>
        <div class="stats-title" id="stats-title"></div>
      </div>

      <div class="chart-card">
        <div class="chart-wrap">
          <canvas id="week-chart"></canvas>
        </div>
        <div class="chart-footer" id="chart-footer">@SamuelD2022  |  Central Florida FSD</div>
      </div>

      <div class="section-label">Daily log</div>
      <div class="table-wrap">
        <table class="daily">
          <thead>
            <tr>
              <th>Date</th>
              <th>Seen</th>
              <th>FSD</th>
              <th>Rate %</th>
            </tr>
          </thead>
          <tbody id="daily-tbody"></tbody>
        </table>
      </div>

      <div class="export-row">
        <a class="btn-link" href="/api/export.csv" download>Download CSV</a>
      </div>
      <p class="meta-note">
        Data stored on Atlas under<br />/workspace/fsd-logger/data/
      </p>
    </section>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="/app.js"></script>
  </body>
</html>
